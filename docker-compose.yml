services:
  autentico:
    image: ghcr.io/eugenioenko/autentico:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      AUTENTICO_APP_URL: http://localhost:9999
      AUTENTICO_DB_FILE_PATH: /data/autentico.db
      AUTENTICO_CSRF_SECRET_KEY: local-dev-change-me-at-least-32-chars
      AUTENTICO_ACCESS_TOKEN_SECRET: local-dev-change-me-at-least-32-chars
      AUTENTICO_REFRESH_TOKEN_SECRET: local-dev-change-me-at-least-32-chars
    volumes:
      - ./data/autentico:/data
